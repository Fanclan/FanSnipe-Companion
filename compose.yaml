services:
  fansnipe:
    image: ghcr.io/fanclan/fansnipe:${FANSNIPE_VERSION:-${STREAMSNIPE_VERSION:-}}
    ports:
      - "${FANSNIPE_BIND:-${STREAMSNIPE_BIND:-127.0.0.1}}:47821:47821"
    environment:
      PUBLIC_ORIGIN: "${FANSNIPE_PUBLIC_ORIGIN:-${STREAMSNIPE_PUBLIC_ORIGIN:-}}"
    volumes:
      - streamsnipe-data:/data
      - streamsnipe-media:/media
    stop_grace_period: 180s
    restart: unless-stopped
volumes:
  streamsnipe-data:
  streamsnipe-media:

name: Companion checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: companion-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Engine and media integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Direct upload and media boundary
        run: node integration/direct-upload.mjs
      - name: Three-stream smoke
        run: node integration/soak.mjs
        env:
          SOAK_SECONDS: '30'
          SOAK_DIRECTORY: ${{ runner.temp }}/fansnipe-smoke
      - name: Upload synthetic test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-smoke-report
          path: ${{ runner.temp }}/fansnipe-smoke/report.json
          if-no-files-found: ignore
  desktop-security:
    name: Desktop boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test desktop/tests/*.test.cjs
